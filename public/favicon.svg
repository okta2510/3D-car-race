<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Terminal Window with Blue Outline -->
  <rect x="12" y="12" width="176" height="176" rx="42" fill="#030712" stroke="#007dfc" stroke-width="14" stroke-linejoin="round"/>
  <!-- Titlebar Divider -->
  <line x1="12" y1="58" x2="188" y2="58" stroke="#007dfc" stroke-width="14" stroke-linecap="round"/>
  <!-- Green Prompt Symbol '>' -->
  <path d="M42 98 L80 134 L42 170" stroke="#84cc16" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Green Cursor Symbol '_' -->
  <rect x="94" y="156" width="48" height="15" rx="7.5" fill="#84cc16"/>
</svg>
